<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dax the Cat</title>
  <style>
    * { margin: 0; padding: 0; }
    body {
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      width: 100dvw;
      width: 100svw;
      height: 100vh;
      height: 100dvh;
      height: 100svh;
      overflow: hidden;
      touch-action: none;
      padding:
        env(safe-area-inset-top, 0)
        env(safe-area-inset-right, 0)
        env(safe-area-inset-bottom, 0)
        env(safe-area-inset-left, 0);
      box-sizing: border-box;
    }
    #game {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* Portrait mode warning for mobile */
    #rotate-warning {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #1a1a2e;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #FFD700;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    #rotate-warning .icon {
      font-size: 64px;
      margin-bottom: 20px;
      animation: wiggle 1.5s ease-in-out infinite;
    }
    #rotate-warning p {
      font-size: 20px;
      margin-top: 10px;
      color: #ccc;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-20deg); }
      75% { transform: rotate(20deg); }
    }
    @media (orientation: portrait) and (max-width: 900px) {
      #rotate-warning { display: flex; }
    }
  </style>
  <script type="module" crossorigin src="/dax-the-cat-game/assets/index-B9eIc2HE.js"></script>

<body>
  <div id="rotate-warning">
    <div class="icon">📱</div>
    <div style="font-size: 24px; font-weight: bold;">Rotate Your Device!</div>
    <p>Dax the Cat plays best in landscape mode</p>
  </div>
  <div id="game"></div>
  <script>
    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    let orientationReloadTimer;
    let orientationPollTimer;

    // Try to lock orientation to landscape on mobile
    try {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    } catch (e) {}

    function getViewportSize() {
      const viewport = window.visualViewport;
      return {
        width: Math.round(viewport ? viewport.width : window.innerWidth),
        height: Math.round(viewport ? viewport.height : window.innerHeight),
      };
    }

    function currentOrientation() {
      const { width, height } = getViewportSize();
      return width >= height ? 'landscape' : 'portrait';
    }

    // Snapshot orientation at boot so we only reload when it ACTUALLY flips,
    // not on every URL-bar show/hide (which fires visualViewport.resize).
    let lastOrientation = currentOrientation();

    function waitForStableLandscapeAndReload() {
      const startedAt = Date.now();
      let lastSample = null;
      let stableCount = 0;

      clearInterval(orientationPollTimer);
      orientationPollTimer = setInterval(function() {
        const sample = getViewportSize();
        const isLandscape = sample.width > sample.height;

        if (!isLandscape) {
          lastSample = sample;
          stableCount = 0;
          if (Date.now() - startedAt > 1800) {
            clearInterval(orientationPollTimer);
          }
          return;
        }

        if (lastSample && lastSample.width === sample.width && lastSample.height === sample.height) {
          stableCount += 1;
        } else {
          stableCount = 0;
          lastSample = sample;
        }

        if (stableCount >= 2 || Date.now() - startedAt > 1800) {
          clearInterval(orientationPollTimer);
          window.location.reload();
        }
      }, 120);
    }

    function handleOrientationChange() {
      if (!isTouchDevice) return;
      const next = currentOrientation();
      if (next === lastOrientation) return; // URL-bar toggle, not a real rotation
      lastOrientation = next;
      clearTimeout(orientationReloadTimer);
      orientationReloadTimer = setTimeout(function() {
        waitForStableLandscapeAndReload();
      }, 150);
    }

    window.addEventListener('orientationchange', handleOrientationChange);
    screen.orientation && screen.orientation.addEventListener('change', handleOrientationChange);
    // Intentionally NOT subscribing to visualViewport.resize — that fires on
    // every URL-bar movement and is exactly the noise we want to ignore.
  </script>
</body>
</html>
